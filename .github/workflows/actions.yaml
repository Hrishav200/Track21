name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2.0"

      - name: Install xcpretty
        run: sudo gem install xcpretty

      # If your project uses a .xcworkspace (CocoaPods/SwiftPM workspace), switch -project to -workspace.
      
      - name: Build & Test (auto-pick simulator)
        run: |
          set -euo pipefail

          # Grab the first available iPhone simulator’s UDID
          UDID="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')"
          if [ -z "${UDID:-}" ]; then
            echo "No available iPhone simulators found"; exit 1
          fi

          echo "Using simulator UDID: $UDID"
          # Boot (no-op if it’s already booted)
          xcrun simctl boot "$UDID" || true

          # OPTIONAL: Wait for boot to be fully ready
          xcrun simctl bootstatus "$UDID" -b

          xcodebuild \
            -scheme "Track21" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -enableCodeCoverage YES \
            clean test | xcpretty
