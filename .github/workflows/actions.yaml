name: Build Track21

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-15  # Use macOS 15 for Xcode 26
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.0_beta.app
        # Or use the setup-xcode action:
        # - uses: maxim-lobanov/setup-xcode@v1
        #   with:
        #     xcode-version: '26.0-beta'
      
      - name: Build
        run: |
          xcodebuild clean build \
            -project Track21.xcodeproj \
            -scheme Track21 \
            -destination 'platform=iOS Simulator,name=iPhone 16'
