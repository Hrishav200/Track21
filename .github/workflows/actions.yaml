name: iOS CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: "16.0" }
      - name: Build & Test
        run: |
          set -o pipefail
          xcodebuild -scheme track21 -destination 'platform=iOS Simulator,name=iPhone 15' clean test | xcpretty
