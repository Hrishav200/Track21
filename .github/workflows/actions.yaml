name: iOS CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2.0"

      - name: Install xcpretty
        run: sudo gem install xcpretty

      # If your project uses a .xcworkspace (CocoaPods/SwiftPM workspace), switch -project to -workspace.
      - name: Build & Test (Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme "Track21" \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES \
            clean test | xcpretty
